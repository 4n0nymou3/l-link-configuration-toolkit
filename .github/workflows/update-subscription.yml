name: Update Subscription

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First setup or recovery. Leave on none for normal runs."
        type: choice
        default: none
        options:
          - none
          - create
          - recreate

permissions: {}

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch the configuration and build the outputs
        env:
          L_STATE_ENCRYPTION_KEY: ${{ secrets.L_STATE_ENCRYPTION_KEY }}
          L_BOOTSTRAP: ${{ inputs.bootstrap || 'none' }}
          L_HYSTERIA2_LINKS: ${{ vars.L_HYSTERIA2_LINKS }}
        run: python -m l_toolkit

      - name: Commit changes
        if: ${{ always() }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in state/upstream-account.enc subscription/sub.txt subscription/singbox.json subscription/xray.json; do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done
          unexpected=$(git diff --cached --name-only | grep -v -x -E 'state/upstream-account\.enc|subscription/(sub\.txt|singbox\.json|xray\.json)' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files are staged, refusing to commit"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update subscription"
          git push
